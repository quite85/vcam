name: 构建与发布

# ============================================================================
# 虚拟摄像头 —— 构建两个 deb 并发布到 GitHub Release + Sileo 源（GitHub Pages）
#
# 触发：
#   · push tag（如 v2.0.0）→ 构建 + 建 Release + 部署 Pages
#   · 手动 workflow_dispatch → 只构建（不建 Release，除非有 tag）
#
# 工程结构（这一版是基于开源项目重写的）：
#   Tweak.xm                    主实现（SpringBoard UI + 音量键 + 进程分流）
#   src/VCamMediaManager.m      视频帧源（AVAssetReader 解码 + 循环 + PTS 重映射）
#   src/VCamFrameInjector.m     帧替换（代理模式包装 AVCaptureVideoDataOutput delegate）
#   src/VCamLog.{h,m}           日志
#   VCam.plist                  filter（22 个 Bundle，不含系统守护进程）
# ============================================================================

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

env:
  THEOS_SDKS_TAG: master-146e41f
  VCAM_SDK_VERSION: '16.5'
  DOMAIN: quite85.github.io
  REPO_PATH: /vcam

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vcam-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls "$THEOS" | head -10

      - name: 安装 ldid
        run: |
          brew install ldid 2>/dev/null || true
          which ldid || echo "ldid 不可用（Theos 会用自带方式签名）"

      - name: 下载 iOS SDK 到 $THEOS/sdks（必须，否则编译直接失败）
        run: |
          set -e
          export THEOS="$HOME/theos"
          SDK="iPhoneOS${VCAM_SDK_VERSION}.sdk"
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/$SDK" ]; then
            echo "SDK 已存在"
          else
            URL="https://github.com/theos/sdks/releases/download/${THEOS_SDKS_TAG}/${SDK}.tar.xz"
            echo "下载 $URL"
            curl -fL --retry 3 -o "/tmp/$SDK.tar.xz" "$URL"
            tar -xJf "/tmp/$SDK.tar.xz" -C "$THEOS/sdks"
          fi
          if [ ! -d "$THEOS/sdks/$SDK" ]; then
            echo "::error::SDK 解压后目录不存在"
            exit 1
          fi
          echo "✅ SDK 就绪: $THEOS/sdks/$SDK"

      - name: 生成 Sileo 源图标（缺失时）
        run: |
          set +e
          chmod +x scripts/*.sh 2>/dev/null || true
          if [ -f repo/CydiaIcon.png ]; then
            echo "repo/CydiaIcon.png 已存在（$(wc -c < repo/CydiaIcon.png) 字节），跳过"
          else
            ./scripts/make-icon.sh 256 || echo "::warning::图标生成失败，不影响安装"
          fi
          exit 0

      - name: 准备 layout
        run: |
          set -e
          # layout/ 下的每个文件都会被原样打进 deb 并安装到设备。
          # 这里刻意保持为空：本工程不需要额外安装任何 filter
          # （VCam.plist 与 tweak 同名，Theos 会自动安装）。
          rm -rf layout
          mkdir -p layout
          echo "layout 已清空（本工程不需要额外文件）"

      - name: 编译两个 deb
        id: builddeb
        run: |
          set +e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          chmod +x scripts/*.sh
          ./scripts/build.sh 2>&1 | tee /tmp/vcam-build.log
          RC=${PIPESTATUS[0]}
          echo ""
          echo "--- build.sh 退出码 = $RC ---"
          echo "--- 产物 ---"
          ls -lh packages/ 2>/dev/null
          if [ "$RC" -ne 0 ]; then
            echo "::error::编译失败，退出码 $RC"
            exit $RC
          fi

      - name: 上传编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcam-build-logs
          path: /tmp/vcam-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 生成 APT 源
        run: |
          set -e
          chmod +x scripts/make-repo.sh
          echo "=== packages/ ==="
          ls -la packages/ 2>/dev/null || echo "（空）"
          DOMAIN="${{ env.DOMAIN }}" REPO_PATH="${{ env.REPO_PATH }}" \
            ./scripts/make-repo.sh
          echo "--- repo 内容 ---"
          ls -R repo | head -40

      - name: 上传 deb 制品
        uses: actions/upload-artifact@v4
        with:
          name: vcam-debs
          path: packages/*.deb
          if-no-files-found: warn

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy-pages:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
