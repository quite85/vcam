# ============================================================================
#  Nginx 配置示例 —— 把 repo/ 目录发布成 Sileo 可订阅的 APT 源
#
#  放置位置：
#    Debian/Ubuntu : /etc/nginx/sites-available/vcam-repo
#                    ln -s /etc/nginx/sites-available/vcam-repo /etc/nginx/sites-enabled/
#    CentOS        : /etc/nginx/conf.d/vcam-repo.conf
#
#  目录约定（与 scripts/make-repo.sh 一致）：
#    /var/www/vcam-repo/                <= 就是工程里的 repo/ 目录
#      ├── Release
#      ├── Packages
#      ├── Packages.gz
#      ├── Packages.bz2
#      ├── CydiaIcon.png
#      ├── sileo-featured.json
#      ├── debs/*.deb
#      ├── depiction/vcam.html
#      ├── depiction/vcam.json
#      └── icons/vcam.png
#
#  证书：用 Let's Encrypt（certbot）。绝对不要自签证书 —— Sileo 会直接失败。
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d repo.example.com
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name repo.example.com;

    # 强制跳 HTTPS（Sileo 只接受 HTTPS 源）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name repo.example.com;

    # ---- Let's Encrypt 证书 ----
    ssl_certificate     /etc/letsencrypt/live/repo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repo.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root  /var/www/vcam-repo;
    index index.html;

    # ------------------------------------------------------------------
    # 关键：APT 元数据（Release / Packages*）必须禁止缓存或只缓存极短时间。
    # 否则用户下拉刷新拿到的还是旧的包列表，看不到新版本。
    # ------------------------------------------------------------------
    location ~ ^/(Release|InRelease|Packages|Packages\.(gz|bz2|xz))$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
        types { }
        default_type text/plain;
        # Release 与 Packages 必须原样输出，不能被任何压缩模块再压一次
        gzip off;
    }

    # ------------------------------------------------------------------
    # .deb 的 MIME。用 Debian 官方类型，兼容性最好。
    # 如果某些老客户端有问题，改成 application/octet-stream。
    # ------------------------------------------------------------------
    location ~ \.deb$ {
        types { }
        default_type application/vnd.debian.binary-package;
        # .deb 已经是压缩包，再 gzip 一层纯属浪费 CPU
        gzip off;
        add_header Cache-Control "public, max-age=3600";
        # 让 Sileo 能正确拿到长度并显示下载进度
        add_header Accept-Ranges bytes;
    }

    location = /Packages.gz {
        types { }
        default_type application/gzip;
        add_header Cache-Control "no-cache";
        gzip off;
    }
    location = /Packages.bz2 {
        types { }
        default_type application/x-bzip2;
        add_header Cache-Control "no-cache";
        gzip off;
    }
    location = /Packages.xz {
        types { }
        default_type application/x-xz;
        add_header Cache-Control "no-cache";
        gzip off;
    }

    # ------------------------------------------------------------------
    # 其余静态资源（图标 / depiction / featured）
    # ------------------------------------------------------------------
    location / {
        # 注意：不要在这里对 Packages* 开 gzip；上面的 location 优先级更高，
        # 所以这里只影响图片和 html/json，安全。
        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                   text/xml image/svg+xml;
        gzip_min_length 1024;

        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ =404;
    }

    # CORS：让网页版 depiction 与第三方工具能读取 JSON
    add_header Access-Control-Allow-Origin "*" always;

    # 关闭目录列表（避免暴露内部文件）
    autoindex off;

    # 日志
    access_log /var/log/nginx/vcam-repo.access.log;
    error_log  /var/log/nginx/vcam-repo.error.log warn;

    # 上传大文件时的限制（对自己 push 新 deb 有用，Sileo 下载不需要）
    client_max_body_size 200m;

    # ------------------------------------------------------------------
    # 可选：只允许特定 User-Agent 访问（不推荐，会挡住 Sileo 的刷新）
    # ------------------------------------------------------------------
    # if ($http_user_agent !~* "(Sileo|Zebra|Cydia|Telesphoreo|APT)") { return 403; }
}

# ============================================================================
#  部署流程（每次发新版本）
# ============================================================================
#  1) 本地（或 CI）执行：
#       ./scripts/build.sh
#       DOMAIN=repo.example.com REPO_PATH= ./scripts/make-repo.sh
#  2) 同步到服务器：
#       rsync -avz --delete repo/ user@server:/var/www/vcam-repo/
#       # 注意：--delete 会删掉服务器上多余的旧 deb，
#       # 如果你想保留历史版本，去掉 --delete，或把旧 deb 移到 debs/old/
#  3) 重载 nginx（改了配置才需要）：
#       sudo nginx -t && sudo systemctl reload nginx
#  4) 用户在 Sileo 下拉刷新即可看到新版本。
#
#  ⚠️ 常见坑：
#   - 每次替换 .deb 之后**必须**重新运行 make-repo.sh，
#     否则 Packages 里的 Size / SHA256 与文件不符，Sileo 会报
#     "Hash Sum mismatch" 或 "Size mismatch"。
#   - 不要在 Nginx 里给 Packages.gz 再套一层 gzip（会变成 .gz.gz，
#     APT 解压失败，报 "File has unexpected size"）。
#   - 不要用自签证书；不要用 HTTP 源。
#   - Cloudflare 用户的坑：必须关闭 "Rocket Loader"，
#     并且对 /Packages* 与 /Release 设置 Cache Rule = Bypass。
# ============================================================================
